name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Actions > Build > Run workflow: builds main and publishes a release with both exes
  workflow_dispatch:
    inputs:
      version:
        description: Release version, such as v1.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check the version and branch
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are made from main, not $GITHUB_REF_NAME."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like v1.2.0, not '$VERSION'."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" > /dev/null 2>&1; then
            echo "::error::$VERSION already exists. Pick a new version."
            exit 1
          fi

  build:
    needs: check-release
    # check-release only runs for releases; build after it passes, or when it's skipped
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test tests/ComputerSetupWizard.Core.Tests

      - name: Publish single-file exe
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Stamp release builds with their version, which shows in the exe's properties
          $version = if ($env:VERSION) { $env:VERSION.TrimStart('v') } else { '0.0.0' }
          dotnet publish src/ComputerSetupWizard -c Release -r ${{ matrix.rid }} `
            -p:PublishSingleFile=true -p:DebugType=none -p:Version=$version -o out

      - name: Name exe for its architecture
        run: Move-Item out/ComputerSetupWizard.exe ComputerSetupWizard-${{ matrix.rid }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ComputerSetupWizard-${{ matrix.rid }}
          path: ComputerSetupWizard-${{ matrix.rid }}.exe

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        # Creates the tag on the commit that was built
        run: >-
          gh release create "$VERSION" ComputerSetupWizard-*.exe
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
